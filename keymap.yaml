layout:
  qmk_keyboard: corne_rotated
  layout_name: LAYOUT_split_3x5_3
layers:
  DEF:
    - [Q,L,D,Z,V,P,W,O,U,"'"]
    - [R,N,T,H,F, Y ,C,E,I,A]
    - [X,J,M,B,K, ";", G, ",", ".", "/"]
    - {t: S}
    - {h: Ctrl,  t: Esc}
    - {h: NAV,   t: BSpace}
    - {h: SYM,   t: Space}
    - {h: Shift, t: Enter}
    - {h: NUM,   t: Space}
  UML:
    - [Q,L,D,Z,V,P,W,O,U,"'"]
    - [R,N,T,H,F, Y ,C,E,I,A]
    - [X,J,M,B,K, ";", G, ",", ".", "/"]
    - {t: S}
    - {h: Ctrl,  t: Esc}
    - {h: NAV,   t: BSpace}
    - {h: SYM,   t: Space}
    - {h: Shift, t: Enter}
    - {h: NUM,   t: Space}
  SYM:
    - ["%", "@", "$", "~", "€", ":", "7", "8", "9", "'"]
    - ["<", "-", "|", ">", "_", ".", "1", "2", "3", "0"]
    - ["&",  "+", "=", "`", "$", ",", "4", "5", "6", "/"]
    - {t: Gui, type: ghost}
    - Space
    - {t: Bspace, h: FUN}
    - {type: held}
    - Shift
    - {t: Alt, type: ghost}
  NAV:
    - ["Win Close", "Tab Prev", "Tab Next", "Tab Close", "Vol Up", Home, "Page Down", "Page Up", End, null]
    - [Ctrl, Gui, Alt, {h: Shift, t: Tab}, "Vol Down", Left, Down, Up, Right, Calc]
    - [null, "Win Prev", "Win Next", "Paste", "Play Pause", Insert, Delete, Prev, Next, null]
    - {t: Gui, type: ghost}
    - Ctrl
    - {type: held}
    - {t: Space, h: FUN}
    - Shift
    - {t: Alt, type: ghost}
  FUN:
    - [F1, F2, F3, F4, F5, "Caps Lock", null, DEF, CLM, GME]
    - [F6, F7, F8, F9, F10, BT1, BT2, BT3, BT4, BT5]
    - [null, "Desk Prev", "Desk Next", F11, F12, "Out USB", "Out BLE", "Print Scrn", "Pause Break", "BT CLR"]
    - {t: Boot, type: ghost}
    - Reset
    - {type: held}
    - {type: held}
    - Reset
    - {t: Boot, type: ghost}
combos:
  - {p: [11, 12],   k: "ctl", l: ["DEF"]}
  - {p: [12, 13],   k: "esc", l: ["DEF"]}
  - {p: [16, 17],   k: ":", l: ["DEF"]}
  - {p: [17, 18],   k: "ctl", l: ["DEF"]}
  - {p: [16, 27],   k: ";", l: ["DEF"]}
  - {p: [10, 11],   k: "ä", l: ["UML"]}
  - {p: [6, 8],   k: "ü", l: ["UML"]}
  - {p: [16, 18], k: "ä", l: ["UML"]}
  - {p: [26, 28], k: "ö", l: ["UML"]}
 
